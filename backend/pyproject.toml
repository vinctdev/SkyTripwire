[project]
name = "skytripwire"
version = "1.0.0"
description = "Self-hosted flight filters and alerts with Telegram and e-mail notifications."
license = "MIT"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "alembic==1.20.1",
    "anyio==4.16.0",
    "apprise==2.1.0",
    "fastapi==0.162.2",
    "httpx2==2.16.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "sqlmodel==0.0.48",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Unofficial Flightradar24 provider, opt-in at runtime. Included in the Docker image.
fr24 = [
    "curl_cffi==0.17.0",
    "FlightRadarAPI==1.7.1",
]

[project.scripts]
skytripwire = "skytripwire.__main__:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skytripwire"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PTH", "N", "C4", "RET", "PL",
]
ignore = [
    "PLR0913", # FastAPI endpoints and settings legitimately take many arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# Autogenerated by Alembic, long SQL expressions are kept on one line.
"src/skytripwire/db/migrations/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
