<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="How SkyTripwire works: the web UI talks to the REST API, which stores filters, channels and alerts in the database. A worker reads the filters every few minutes, bundles them into few requests, fetches aircraft from adsb.lol or FR24, matches them against the filters, saves new alerts and sends notifications.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 15px; font-weight: 600; }
    .detail { font-size: 13px; fill: #59636e; }
    .mod { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #00737e; }
    .panel-title { font-size: 14px; font-weight: 600; fill: #00737e; }
    .box { fill: #ffffff; stroke: #d1d9e0; stroke-width: 1.5; }
    .step { fill: #ffffff; stroke: #00737e; stroke-width: 1.5; }
    .panel { fill: #00737e; fill-opacity: 0.06; stroke: #00737e; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .arrow { stroke: #59636e; stroke-width: 1.75; fill: none; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .detail { fill: #9198a1; }
      .mod, .panel-title { fill: #44d6d6; }
      .box { fill: #151b23; stroke: #3d444d; }
      .step { fill: #151b23; stroke: #44d6d6; }
      .panel { fill: #44d6d6; fill-opacity: 0.07; stroke: #44d6d6; }
      .arrow { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10Z"/>
    </marker>
  </defs>

  <!-- Top row: web UI, REST API, database -->
  <rect class="box" x="40" y="20" width="150" height="80" rx="8"/>
  <text class="title" x="115" y="48" text-anchor="middle">Web UI</text>
  <text class="detail" x="115" y="68" text-anchor="middle">React, in the browser</text>
  <text class="mod" x="115" y="87" text-anchor="middle">frontend/</text>

  <path class="arrow" d="M192 60H246" marker-end="url(#head)"/>

  <rect class="box" x="250" y="20" width="150" height="80" rx="8"/>
  <text class="title" x="325" y="48" text-anchor="middle">REST API</text>
  <text class="detail" x="325" y="68" text-anchor="middle">FastAPI, /api</text>
  <text class="mod" x="325" y="87" text-anchor="middle">api/</text>

  <path class="arrow" d="M402 60H456" marker-end="url(#head)"/>

  <!-- Database as a cylinder -->
  <path class="box" d="M460 30C460 18 610 18 610 30V92C610 104 460 104 460 92Z"/>
  <path class="box" d="M460 30C460 42 610 42 610 30" fill="none"/>
  <text class="title" x="535" y="60" text-anchor="middle">Database</text>
  <text class="detail" x="535" y="78" text-anchor="middle">SQLite</text>
  <text class="mod" x="535" y="95" text-anchor="middle">db/</text>

  <!-- Database <-> worker -->
  <path class="arrow" d="M535 108V156" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="detail" x="547" y="129">reads filters,</text>
  <text class="detail" x="547" y="146">saves alerts</text>

  <!-- Worker -->
  <rect class="panel" x="20" y="160" width="700" height="150" rx="10"/>
  <text x="40" y="186"><tspan class="panel-title">Worker, every few minutes</tspan><tspan class="mod" dx="14">engine/worker.py</tspan></text>

  <rect class="step" x="40" y="204" width="150" height="86" rx="8"/>
  <text class="title" x="115" y="232" text-anchor="middle">1. Bundle filters</text>
  <text class="detail" x="115" y="252" text-anchor="middle">into few requests</text>
  <text class="mod" x="115" y="274" text-anchor="middle">engine/planner.py</text>

  <path class="arrow" d="M192 247H206" marker-end="url(#head)"/>

  <rect class="step" x="210" y="204" width="150" height="86" rx="8"/>
  <text class="title" x="285" y="232" text-anchor="middle">2. Fetch aircraft</text>
  <text class="detail" x="285" y="252" text-anchor="middle">adsb.lol or FR24</text>
  <text class="mod" x="285" y="274" text-anchor="middle">providers/</text>

  <path class="arrow" d="M362 247H376" marker-end="url(#head)"/>

  <rect class="step" x="380" y="204" width="150" height="86" rx="8"/>
  <text class="title" x="455" y="232" text-anchor="middle">3. Match filters</text>
  <text class="detail" x="455" y="252" text-anchor="middle">area, type, ...</text>
  <text class="mod" x="455" y="274" text-anchor="middle">engine/matcher.py</text>

  <path class="arrow" d="M532 247H546" marker-end="url(#head)"/>

  <rect class="step" x="550" y="204" width="150" height="86" rx="8"/>
  <text class="title" x="625" y="232" text-anchor="middle">4. Save new alerts</text>
  <text class="detail" x="625" y="252" text-anchor="middle">per-filter cooldown</text>
  <text class="mod" x="625" y="274" text-anchor="middle">engine/dedup.py</text>

  <!-- Notifications -->
  <path class="arrow" d="M702 247H766" marker-end="url(#head)"/>

  <rect class="box" x="770" y="204" width="160" height="86" rx="8"/>
  <text class="title" x="850" y="232" text-anchor="middle">Notify</text>
  <text class="detail" x="850" y="252" text-anchor="middle">Telegram, e-mail, ...</text>
  <text class="mod" x="850" y="274" text-anchor="middle">notify/</text>
</svg>
